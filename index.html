<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Content</title>
<style>
  :root {
    --bg: #080810;
    --surface: #10101a;
    --surface2: #18182a;
    --border: #232338;
    --accent: #8b74ff;
    --accent2: #b39dff;
    --glow: rgba(139,116,255,0.25);
    --text: #eeeef8;
    --text2: #7777aa;
    --text3: #4444aa;
    --radius: 18px;
    --radius-lg: 24px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── BACKGROUND ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(100,80,220,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(60,40,180,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── NAV ─── */
  .nav {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(8,8,16,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-logo {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ─── VIEWS ─── */
  #view-home, #view-detail { position: relative; z-index: 1; }
  .hidden { display: none !important; }

  /* ═══════════════════════════
     HOME PAGE
  ═══════════════════════════ */
  .home-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 18px 60px;
  }
  .home-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .home-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(139,116,255,0.1);
    border: 1px solid rgba(139,116,255,0.25);
    border-radius: 40px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent2);
    margin-bottom: 16px;
  }
  .home-title {
    font-size: clamp(26px, 5vw, 44px);
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .home-title span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .home-sub {
    color: var(--text2);
    font-size: 15px;
    max-width: 400px;
    margin: 0 auto;
  }

  /* GRID */
  .content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .content-card {
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1), border-color 0.25s, box-shadow 0.3s;
    position: relative;
  }
  .content-card:hover {
    transform: translateY(-6px) scale(1.01);
    border-color: rgba(139,116,255,0.5);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px var(--glow);
  }
  .content-card:active { transform: translateY(-2px) scale(0.99); }
  .card-thumb {
    position: relative;
    aspect-ratio: 16/10;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .content-card:hover .card-thumb img { transform: scale(1.06); }
  /* Mini play indicator on cards */
  .card-play-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
  }
  .content-card:hover .card-play-badge {
    background: var(--accent);
    transform: scale(1.1);
  }
  .card-play-badge svg { width: 14px; height: 14px; fill: #fff; margin-left: 2px; }
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(8,8,16,0.7) 0%, transparent 50%);
  }
  .card-body { padding: 12px 14px 14px; }
  .card-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-meta {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .card-dot { width: 3px; height: 3px; background: var(--text3); border-radius: 50%; }

  /* LOADING STATE */
  .grid-loader {
    grid-column: 1/-1;
    display: flex;
    justify-content: center;
    padding: 60px 0;
  }
  .loader-ring {
    width: 44px; height: 44px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-home {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }
  .empty-home .e-icon { font-size: 52px; margin-bottom: 16px; }
  .empty-home p { font-size: 15px; }
  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .skeleton-img {
    aspect-ratio: 16/10;
    background: var(--surface2);
  }
  .skeleton-line {
    height: 12px;
    background: var(--surface2);
    border-radius: 6px;
    margin: 14px 14px 6px;
  }
  .skeleton-line.short { width: 60%; height: 10px; margin-bottom: 14px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ═══════════════════════════
     DETAIL PAGE
  ═══════════════════════════ */
  .detail-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  /* BACK BUTTON */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 22px;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── VIDEO PLAYER CONTAINER ─── */
  .player-container {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #000;
    box-shadow:
      0 0 0 1px var(--border),
      0 30px 80px rgba(0,0,0,0.8),
      0 0 60px var(--glow);
    margin-bottom: 28px;
    aspect-ratio: 16/10;
  }
  .player-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .player-container:hover .player-img { transform: scale(1.02); }

  /* Cinematic overlay */
  .player-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
  }

  /* ─── PLAY BUTTON ─── */
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 2px solid rgba(255,255,255,0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
      background 0.2s,
      border-color 0.2s,
      box-shadow 0.2s;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.5),
      0 0 0 0 rgba(255,255,255,0.2),
      inset 0 1px 0 rgba(255,255,255,0.3);
    z-index: 10;
  }
  .play-btn:hover {
    transform: translate(-50%, -50%) scale(1.12);
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.7);
    box-shadow:
      0 12px 48px rgba(0,0,0,0.6),
      0 0 40px rgba(255,255,255,0.15),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .play-btn:active {
    transform: translate(-50%, -50%) scale(0.93);
    transition-duration: 0.1s;
  }
  /* Triangle play icon */
  .play-triangle {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 13px 0 13px 24px;
    border-color: transparent transparent transparent #ffffff;
    margin-left: 5px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
    flex-shrink: 0;
  }

  /* Pulse ring animation */
  .play-btn::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    animation: pulse-ring 2.5s ease-out infinite;
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.9); opacity: 0.7; }
    80%, 100% { transform: scale(1.4); opacity: 0; }
  }

  /* Player chrome elements */
  .player-chrome {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    z-index: 5;
  }
  .chrome-dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .chrome-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
  }
  .chrome-dot.active { background: var(--accent2); width: 18px; border-radius: 3px; }
  .chrome-time {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .progress-track {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255,255,255,0.15);
  }
  .progress-track-fill {
    height: 100%;
    width: 38%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 0 2px 2px 0;
  }

  /* ─── DETAIL BUTTONS ─── */
  .detail-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .detail-btn {
    display: block;
    width: 100%;
    padding: 18px 24px;
    border-radius: var(--radius);
    border: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition:
      transform 0.25s cubic-bezier(0.34,1.3,0.64,1),
      box-shadow 0.25s,
      opacity 0.2s;
    position: relative;
    overflow: hidden;
  }
  .detail-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,0.08), transparent);
    pointer-events: none;
  }
  .detail-btn:hover {
    transform: translateY(-3px);
    text-decoration: none;
  }
  .detail-btn:active { transform: translateY(0) scale(0.98); transition-duration: 0.1s; }

  .detail-btn-1 {
    background: linear-gradient(135deg, #8b74ff, #6d55f5);
    color: #fff;
    box-shadow: 0 8px 30px rgba(109,85,245,0.4);
  }
  .detail-btn-1:hover { box-shadow: 0 12px 40px rgba(109,85,245,0.55); }

  .detail-btn-2 {
    background: linear-gradient(135deg, #1e1e35, #2a2a48);
    color: var(--accent2);
    border: 1.5px solid rgba(139,116,255,0.35);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .detail-btn-2:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px var(--glow);
  }

  .detail-btn-3 {
    background: rgba(255,255,255,0.04);
    color: var(--text2);
    border: 1.5px solid var(--border);
  }
  .detail-btn-3:hover {
    background: rgba(255,255,255,0.07);
    color: var(--text);
    border-color: rgba(139,116,255,0.3);
  }

  /* ─── LOADING OVERLAY for detail ─── */
  .detail-skeleton {
    animation: pulse 1.5s ease-in-out infinite;
  }
  .skel-box {
    background: var(--surface);
    border-radius: var(--radius-lg);
    aspect-ratio: 16/10;
    margin-bottom: 28px;
    border: 1px solid var(--border);
  }
  .skel-btn {
    background: var(--surface);
    border-radius: var(--radius);
    height: 58px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }

  /* ─── ERROR STATE ─── */
  .error-state {
    text-align: center;
    padding: 80px 24px;
  }
  .error-icon { font-size: 52px; margin-bottom: 16px; }
  .error-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .error-sub { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
  .btn-retry {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .btn-retry:hover { opacity: 0.85; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .nav { padding: 0 14px; }
    .home-wrap { padding: 20px 12px 60px; }
    .content-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .detail-wrap { padding: 16px 12px 60px; }
    .play-btn { width: 64px; height: 64px; }
    .play-triangle { border-width: 11px 0 11px 20px; margin-left: 4px; }
    .detail-btn { padding: 16px 20px; font-size: 14px; }
  }
  @media (max-width: 380px) {
    .content-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">⚡ Premium</div>
</nav>

<!-- HOME VIEW -->
<div id="view-home">
  <div class="home-wrap">
    <div class="home-header">
      <div class="home-eyebrow">
        <span>🎬</span>
        <span>Premium Content</span>
      </div>
      <h1 class="home-title">Explore <span>Premium</span> Collection</h1>
      <p class="home-sub">Tap any item to view details and access exclusive links.</p>
    </div>
    <div class="content-grid" id="contentGrid">
      <!-- Skeleton loaders -->
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
      <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    </div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div id="view-detail" class="hidden">
  <div class="detail-wrap">
    <button class="back-btn" onclick="goHome()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── CONFIGURE YOUR FIREBASE PROJECT HERE ──
const firebaseConfig = {
  apiKey: "AIzaSyBckhSGDPIwu1-hscKwqfEDXQPwPu-gfzs",
  authDomain: "new-earning-bd.firebaseapp.com",
  projectId: "new-earning-bd",
  storageBucket: "new-earning-bd.firebasestorage.app",
  messagingSenderId: "181822999162",
  appId: "1:181822999162:web:9e83d4559cbf7fd0f049c3"
};
// ──────────────────────────────────────────

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ─── ROUTE CHECK ───
const urlParams = new URLSearchParams(window.location.search);
const pageId = urlParams.get('id');

if (pageId) {
  showDetailById(pageId);
} else {
  loadHome();
}

// ─── HOME ───
async function loadHome() {
  const grid = document.getElementById('contentGrid');
  try {
    const snap = await getDocs(collection(db, 'content'));
    grid.innerHTML = '';
    if (snap.empty) {
      grid.innerHTML = `<div class="empty-home"><div class="e-icon">📭</div><p>No content available yet.</p></div>`;
      return;
    }
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const card = buildCard(d);
      grid.appendChild(card);
    });
  } catch(e) {
    grid.innerHTML = `<div class="empty-home"><div class="e-icon">⚠️</div><p>Failed to load content.<br><small>${e.message}</small></p></div>`;
  }
}

function buildCard(d) {
  const card = document.createElement('div');
  card.className = 'content-card';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', 'Open detail');
  card.innerHTML = `
    <div class="card-thumb">
      <img src="${d.imageUrl}" alt="content" loading="lazy">
      <div class="card-overlay"></div>
      <div class="card-play-badge">
        <svg viewBox="0 0 12 12"><path d="M2 1.5L10 6L2 10.5V1.5Z"/></svg>
      </div>
    </div>
    <div class="card-body">
      <div class="card-label">${d.buttonText1 || 'View Now'}</div>
      <div class="card-meta">
        <span>Tap to explore</span>
        <span class="card-dot"></span>
        <span>${d.id}</span>
      </div>
    </div>
  `;
  const open = () => showDetail(d);
  card.addEventListener('click', open);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
  return card;
}

// ─── SHOW DETAIL (from home click) ───
function showDetail(d) {
  // এখানে / (স্ল্যাশ) যুক্ত করা হয়েছে
  window.history.pushState({}, '', `/?id=${d.id}`);
  renderDetail(d);
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-detail').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── SHOW DETAIL BY ID (from URL) ───
async function showDetailById(id) {
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-detail').classList.remove('hidden');

  const container = document.getElementById('detailContent');
  container.innerHTML = `
    <div class="detail-skeleton">
      <div class="skel-box"></div>
      <div class="skel-btn"></div>
      <div class="skel-btn"></div>
      <div class="skel-btn"></div>
    </div>`;

  try {
    const q = query(collection(db, 'content'), where('id', '==', id));
    const snap = await getDocs(q);
    if (snap.empty) {
      renderError('Content not found', 'The item you are looking for does not exist or has been removed.');
      return;
    }
    renderDetail(snap.docs[0].data());
  } catch(e) {
    renderError('Failed to load', e.message);
  }
}

function renderDetail(d) {
  const container = document.getElementById('detailContent');
  container.innerHTML = `
    <!-- PLAYER -->
    <div class="player-container" id="playerContainer">
      <img class="player-img" src="${d.imageUrl}" alt="content" id="playerImg">
      <div class="player-overlay"></div>

      <!-- PLAY BUTTON -->
      <button class="play-btn" id="playBtn" aria-label="Play">
        <span class="play-triangle"></span>
      </button>

      <!-- Fake chrome bottom bar -->
      <div class="player-chrome">
        <div class="chrome-dots">
          <div class="chrome-dot active"></div>
          <div class="chrome-dot"></div>
          <div class="chrome-dot"></div>
        </div>
        <div class="chrome-time">00:00 / 00:00</div>
      </div>
      <div class="progress-track">
        <div class="progress-track-fill"></div>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="detail-buttons">
      <a class="detail-btn detail-btn-1" href="${escUrl(d.buttonUrl1)}" target="_blank" rel="noopener noreferrer">
        ${esc(d.buttonText1 || 'WATCH NOW')}
      </a>
      <a class="detail-btn detail-btn-2" href="${escUrl(d.buttonUrl2)}" target="_blank" rel="noopener noreferrer">
        ${esc(d.buttonText2 || 'PLAY NOW')}
      </a>
      <a class="detail-btn detail-btn-3" href="${escUrl(d.buttonUrl3)}" target="_blank" rel="noopener noreferrer">
        ${esc(d.buttonText3 || 'CONTINUE')}
      </a>
    </div>
  `;

  // Attach play button action
  document.getElementById('playBtn').addEventListener('click', () => {
    const url = d.playUrl;
    if (url) window.open(url, '_blank', 'noopener,noreferrer');
  });
}

function renderError(title, sub) {
  document.getElementById('detailContent').innerHTML = `
    <div class="error-state">
      <div class="error-icon">😕</div>
      <div class="error-title">${esc(title)}</div>
      <div class="error-sub">${esc(sub)}</div>
      <button class="btn-retry" onclick="goHome()">← Go Home</button>
    </div>`;
}

// ─── BACK ───
window.goHome = function() {
  // এখানে / (স্ল্যাশ) যুক্ত করা হয়েছে
  window.history.pushState({}, '', '/');
  document.getElementById('view-detail').classList.add('hidden');
  document.getElementById('view-home').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// Handle browser back/forward
window.addEventListener('popstate', () => {
  const p = new URLSearchParams(window.location.search).get('id');
  if (p) {
    showDetailById(p);
  } else {
    document.getElementById('view-detail').classList.add('hidden');
    document.getElementById('view-home').classList.remove('hidden');
  }
});

// ─── UTILS ───
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escUrl(url) {
  if (!url) return '#';
  try { new URL(url); return url; } catch { return '#'; }
}
</script>
